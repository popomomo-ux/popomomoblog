<style>
  /* --- 1. 読書進捗バーのスタイル --- */
  #reading-progress {
    position: fixed;
    top: 0;
    left: 0;
    height: 4px;
    background: #0366d6;
    width: 0%;
    z-index: 9999;
    transition: width 0.1s ease;
  }
  /* --- 2. トップへ戻るボタンのスタイル --- */
  #back-to-top {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: #24292e;
    color: white;
    border: none;
    padding: 10px 14px;
    border-radius: 50%;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    opacity: 0;
    pointer-events: none;
    transform: translateY(10px);
    transition: opacity 0.3s ease, transform 0.3s ease;
    z-index: 999;
    font-size: 14px;
  }
  #back-to-top.show {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0);
  }

  /* --- 3. 画像拡大表示のスタイル --- */
  .page__content img {
    cursor: zoom-in;
    transition: opacity 0.2s ease;
  }
  #image-modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.8);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 99999;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.3s ease, visibility 0.3s ease;
    cursor: zoom-out;
  }
  #image-modal.active {
    opacity: 1;
    visibility: visible;
  }
  #image-modal img {
    max-width: 90%;
    max-height: 90%;
    border-radius: 4px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }

  /* --- 4. レトロRPG風プロフィールリンク --- */
  .author__urls li a {
    display: flex;
    align-items: center;
    background-color: #111111;
    border: 2px solid #333333;
    color: #dddddd !important;
    padding: 8px 12px;
    margin-bottom: 8px;
    text-decoration: none !important;
    font-family: 'Courier New', Courier, monospace;
    box-shadow: 2px 2px 0px #000000;
    transition: background-color 0.1s, border-color 0.1s;
  }

  .author__urls li a:hover {
    background-color: #1a1a1a;
    border-color: #ffcc00;
    color: #ffffff !important;
  }

  .author__urls li a::before {
    content: "▷ ";
    opacity: 0;
    color: #ffcc00;
    font-weight: bold;
    width: 0;
    overflow: hidden;
    transition: opacity 0.2s, width 0.2s;
  }

  .author__urls li a:hover::before {
    opacity: 1;
    width: 1.5em;
  }

  /* --- 5. 画面サイズ別の表示切り替え --- */

  /* ① PC（デスクトップ）表示時（64.01em以上）：ボタンを消して常にリンクを展開 */
  @media screen and (min-width: 64.01em) {
    .sidebar .author__urls-wrapper button,
    .sidebar button.author__switcher {
      display: none !important;
    }
    .sidebar .author__urls-wrapper {
      display: block !important;
      max-height: none !important;
      overflow: visible !important;
    }
    .sidebar .author__urls {
      display: block !important;
    }
  }

  /* ② スマホ・タブレット表示時（64em以下）：ボタンを表示して折りたたみ式にする */
  @media screen and (max-width: 64em) {
    .sidebar .author__urls-wrapper button,
    .sidebar button.author__switcher {
      display: block !important;
    }
  }

  /* --- 6. 埋め込みマップのスタイル調整 --- */
  #blog-map {
    width: 100%;
    height: 400px;
    border-radius: 8px;
    margin: 20px 0;
    z-index: 1;
  }

  /* --- Author（プロフィール）全体の左寄せ・余白調整 --- */

  /* 1. サイドバー全体の左側パディングを詰めて左端に寄せる場合 */
  .sidebar {
    padding-left: 0 !important;
  }

  /* 2. プロフィール内のテキスト（名前やバイオなど）を左揃えにする */
  .sidebar .author__content {
    text-align: left !important;
    padding-left: 0 !important;
  }

  /* 3. レトロRPG風のリンク（メニュー）の配置を左側に詰める */
  .sidebar .author__urls {
    text-align: left !important;
    padding-left: 0 !important;
  }

  .sidebar .author__urls li a {
    justify-content: flex-start !important;
    margin-left: 0 !important;
  }

　{% if page.id %}
  .author__profile {
    display: none !important;
  }
  {% endif %}
</style>

<script>
document.addEventListener("DOMContentLoaded", () => {
  // --- 1. 読書進捗バーの処理 ---
  const progress = document.createElement("div");
  progress.id = "reading-progress";
  document.body.appendChild(progress);

  window.addEventListener("scroll", () => {
    const winScroll = document.documentElement.scrollTop || document.body.scrollTop;
    const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
    const scrolled = (winScroll / height) * 100;
    progress.style.width = scrolled + "%";
  });

  // --- 2. トップへ戻るボタンの処理 ---
  const btn = document.createElement("button");
  btn.id = "back-to-top";
  btn.innerHTML = "▲";
  btn.title = "トップへ戻る";
  document.body.appendChild(btn);

  const toggleButton = () => {
    if (window.scrollY > 100) {
      btn.classList.add("show");
    } else {
      btn.classList.remove("show");
    }
  };
  window.addEventListener("scroll", toggleButton);
  toggleButton();

  btn.addEventListener("click", () => {
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  // --- 3. 画像拡大表示の処理 ---
  const modal = document.createElement("div");
  modal.id = "image-modal";
  const modalImg = document.createElement("img");
  modal.appendChild(modalImg);
  document.body.appendChild(modal);

  const images = document.querySelectorAll(".page__content img");
  images.forEach(img => {
    img.addEventListener("click", () => {
      modalImg.src = img.src;
      modal.classList.add("active");
    });
  });

  modal.addEventListener("click", () => {
    modal.classList.remove("active");
  });

  // --- 4. スマホの「Follow」ボタンの文字を「Menu」に変更 ---
  const changeFollowToMenu = () => {
    const buttons = document.querySelectorAll(".author__urls-wrapper button, button.author__switcher");
    buttons.forEach(b => {
      if (b.innerHTML.includes("Follow")) {
        b.innerHTML = b.innerHTML.replace("Follow", "Menu");
      }
    });
  };
  changeFollowToMenu();
  // 読み込みタイミングのずれ対策
  setTimeout(changeFollowToMenu, 100);
});
</script>
