<style>
  /* --- 1. 読書進捗バーのスタイル --- */
  #reading-progress {
    position: fixed;
    top: 0;
    left: 0;
    height: 4px;
    background: #0366d6;
    width: 0%;
    z-index: 9999;
    transition: width 0.1s ease;
  }
  /* --- 2. トップへ戻るボタンのスタイル --- */
  #back-to-top {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: #24292e;
    color: white;
    border: none;
    padding: 10px 14px;
    border-radius: 50%;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    opacity: 0;
    pointer-events: none;
    transform: translateY(10px);
    transition: opacity 0.3s ease, transform 0.3s ease;
    z-index: 999;
    font-size: 14px;
  }
  #back-to-top.show {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0);
  }

  /* --- 3. 画像拡大表示のスタイル --- */
  .page__content img {
    cursor: zoom-in;
    transition: opacity 0.2s ease;
  }
  #image-modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.8);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 99999;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.3s ease, visibility 0.3s ease;
    cursor: zoom-out;
  }
  #image-modal.active {
    opacity: 1;
    visibility: visible;
  }
  #image-modal img {
    max-width: 90%;
    max-height: 90%;
    border-radius: 4px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }

  /* --- 4. レトロRPG風：author全体を囲むウィンドウ（クエストボード共通カラー・高詳細度指定） --- */
  div.sidebar div.author__profile,
  .sidebar .author__profile,
  .author__profile {
    background-color: #15152b !important; /* クエストボードのセクション背景色と統一 */
    border: 2px solid #444466 !important; /* クエストボードの枠線色と統一 */
    box-shadow: 4px 4px 0px #000000 !important;
    padding: 16px !important;
    border-radius: 4px !important;
    margin-bottom: 20px !important;
    font-family: 'Courier New', Courier, monospace !important;
    color: #f3f3f3 !important;
    display: block !important;
    width: 100% !important;
    box-sizing: border-box !important;
  }

  /* 作者名のカラー（クエストボードのタイトル等と同じゴールド） */
  .sidebar .author__name,
  .author__name {
    color: #ffcc00 !important;
    font-size: 1rem !important;
    font-weight: bold !important;
    margin-top: 10px !important;
    text-shadow: 1px 1px 0px #000000;
  }

  /* 自己紹介文のカラー */
  .sidebar .author__bio,
  .author__bio {
    color: #dddddd !important;
    font-size: 0.85rem !important;
  }

  /* レトロRPG風のリンク（メニュー） */
  .author__urls li a {
    display: flex;
    align-items: center;
    background-color: #0d0d1a !important; /* クエストボードのベース背景色と統一 */
    border: 1px solid #33334d !important;
    color: #dddddd !important;
    padding: 8px 12px;
    margin-bottom: 8px;
    text-decoration: none !important;
    font-family: 'Courier New', Courier, monospace;
    box-shadow: 2px 2px 0px #000000;
    transition: background-color 0.1s, border-color 0.1s;
  }

  .author__urls li a:hover {
    background-color: #15152b !important;
    border-color: #ffcc00 !important;
    color: #ffffff !important;
  }

  .author__urls li a::before {
    content: "▷ ";
    opacity: 0;
    color: #ffcc00;
    font-weight: bold;
    width: 0;
    overflow: hidden;
    transition: opacity 0.2s, width 0.2s;
  }

  .author__urls li a:hover::before {
    opacity: 1;
    width: 1.5em;
  }

  /* --- 5. 画面サイズ別の表示切り替え --- */

  /* ① PC（デスクトップ）表示時（64.01em以上）：ボタンを消して常にリンクを展開 */
  @media screen and (min-width: 64.01em) {
    .sidebar .author__urls-wrapper button,
    .sidebar button.author__switcher {
      display: none !important;
    }
    .sidebar .author__urls-wrapper {
      display: block !important;
      max-height: none !important;
      overflow: visible !important;
    }
    .sidebar .author__urls {
      display: block !important;
    }
  }

  /* ② スマホ・タブレット表示時（64em以下）：ボタンを表示して折りたたみ式にする */
  @media screen and (max-width: 64em) {
    .sidebar .author__urls-wrapper button,
    .sidebar button.author__switcher {
      display: block !important;
    }
  }

  /* --- 6. 埋め込みマップのスタイル調整 --- */
  #blog-map {
    width: 100%;
    height: 400px;
    border-radius: 8px;
    margin: 20px 0;
    z-index: 1;
  }
/* --- 7. レトロRPG風 会話（チャット）レイアウト --- */
  .rpg-dialogue {
    display: flex;
    align-items: flex-start;
    gap: 15px;
    margin: 16px 0;
    font-family: 'Courier New', Courier, monospace;
  }
  /* 右側に配置したい場合（もも用など） */
  .rpg-dialogue.reverse {
    flex-direction: row-reverse;
  }
  .rpg-speaker-avatar {
    width: 48px;
    height: 48px;
    border: 2px solid #444466;
    border-radius: 4px;
    object-fit: cover;
    background-color: #15152b;
    flex-shrink: 0;
    box-shadow: 2px 2px 0px #000000;
  }
  .rpg-bubble {
    background-color: #15152b;
    border: 2px solid #444466;
    box-shadow: 4px 4px 0px #000000;
    padding: 12px 16px;
    border-radius: 4px;
    flex-grow: 1;
    color: #f3f3f3;
    font-size: 0.9rem;
    line-height: 1.5;
  }
  .rpg-speaker-name {
    font-weight: bold;
    font-size: 0.85rem;
    margin-bottom: 6px;
    display: inline-block;
    padding-bottom: 2px;
    border-bottom: 1px dashed #444466;
  }
  /* ぽぽの名前カラー（シアン系） */
  .rpg-speaker-name.popo {
    color: #00ffcc;
  }
  /* ももの名前カラー（ピンク系） */
  .rpg-speaker-name.momo {
    color: #ff99cc;
  }
  /* --- Author（プロフィール）全体の左寄せ・余白調整 --- */
  .sidebar {
    padding-left: 0 !important;
  }
  .sidebar .author__content {
    text-align: left !important;
    padding-left: 0 !important;
  }
  .sidebar .author__urls {
    text-align: left !important;
    padding-left: 0 !important;
  }
  .sidebar .author__urls li a {
    justify-content: flex-start !important;
    margin-left: 0 !important;
  }

/* --- 8. レトロRPG風：目次（TOC）のスタイル --- */
  .toc {
    background-color: #15152b !important;
    border: 2px solid #444466 !important;
    box-shadow: 4px 4px 0px #000000 !important;
    padding: 16px !important;
    border-radius: 4px !important;
    margin: 20px 0 !important;
    font-family: 'Courier New', Courier, monospace !important;
    color: #f3f3f3 !important;
  }

  .toc .toc__title {
    color: #ffcc00 !important;
    font-size: 0.95rem !important;
    font-weight: bold !important;
    border-bottom: 1px dashed #444466 !important;
    padding-bottom: 8px !important;
    margin-bottom: 10px !important;
    text-shadow: 1px 1px 0px #000000;
  }

  .toc ul {
    list-style-type: none !important;
    padding-left: 0 !important;
    margin: 0 !important;
    font-size: 0.85rem !important;
  }

  .toc li {
    margin-bottom: 6px !important;
    border-bottom: 1px dashed #22233b !important;
    padding-bottom: 4px !important;
  }

  .toc li:last-child {
    border-bottom: none !important;
  }

  .toc a {
    color: #00ffcc !important;
    text-decoration: none !important;
  }

  .toc a:hover {
    color: #ffcc00 !important;
    text-decoration: underline !important;
  }
  
</style>

<script>
document.addEventListener("DOMContentLoaded", () => {
  // --- 1. 読書進捗バーの処理 ---
  const progress = document.createElement("div");
  progress.id = "reading-progress";
  document.body.appendChild(progress);

  window.addEventListener("scroll", () => {
    const winScroll = document.documentElement.scrollTop || document.body.scrollTop;
    const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
    const scrolled = (winScroll / height) * 100;
    progress.style.width = scrolled + "%";
  });

  // --- 2. トップへ戻るボタンの処理 ---
  const btn = document.createElement("button");
  btn.id = "back-to-top";
  btn.innerHTML = "▲";
  btn.title = "トップへ戻る";
  document.body.appendChild(btn);

  const toggleButton = () => {
    if (window.scrollY > 100) {
      btn.classList.add("show");
    } else {
      btn.classList.remove("show");
    }
  };
  window.addEventListener("scroll", toggleButton);
  toggleButton();

  btn.addEventListener("click", () => {
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  // --- 3. 画像拡大表示の処理 ---
  const modal = document.createElement("div");
  modal.id = "image-modal";
  const modalImg = document.createElement("img");
  modal.appendChild(modalImg);
  document.body.appendChild(modal);

  const images = document.querySelectorAll(".page__content img");
  images.forEach(img => {
    img.addEventListener("click", () => {
      modalImg.src = img.src;
      modal.classList.add("active");
    });
  });

  modal.addEventListener("click", () => {
    modal.classList.remove("active");
  });

  // --- 4. スマホの「Follow」ボタンの文字を「Menu」に変更 ---
  const changeFollowToMenu = () => {
    const buttons = document.querySelectorAll(".author__urls-wrapper button, button.author__switcher");
    buttons.forEach(b => {
      if (b.innerHTML.includes("Follow")) {
        b.innerHTML = b.innerHTML.replace("Follow", "Menu");
      }
    });
  };
  changeFollowToMenu();
  setTimeout(changeFollowToMenu, 100);
});
</script>
